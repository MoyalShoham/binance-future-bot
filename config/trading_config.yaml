# Trading System Configuration

# Execution Settings
trading:
  enabled: true
  execution_mode: "live"  # paper | live | hybrid
  testnet: false  # Use Binance mainnet for market data
  max_concurrent_positions: 3
  default_leverage: 15

  # Scalping configuration
  scalping:
    enabled: true
    min_profit_target_pct: 0.003  # 0.3% minimum profit target
    max_holding_time_seconds: 900  # 15 minutes max (give wider TP targets time to hit)
    timeframes: ["1m", "5m", "15m"]

  # Fallback symbols (used when scanner is disabled or fails)
  symbols:
    - "XRPUSDT"
    - "LINKUSDT"
    - "DOGEUSDT"
    - "1000SHIBUSDT"
    - "1000FLOKIUSDT"
    - "ADAUSDT"
    - "DOTUSDT"
    - "AVAXUSDT"

# Hot Symbol Scanner - multi-source symbol discovery each round
symbol_scanner:
  enabled: true
  min_volume_usdt: 200000000      # Min 24h volume $200M (stricter liquidity filter, was $100M)
  top_n: 4                        # Pick top 4 movers ($125 can't trade 8 symbols)
  min_price_change_pct: 1.5       # Min 1.5% 24h change (momentum filter)
  max_price_change_pct: 15.0      # Max 15% - skip pump-and-dump memecoins (was 30%)
  always_include: ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT"]  # Blue-chips: tight spreads, low funding, deep books

  # External sources (merged with Binance movers, multi-source symbols get boosted)
  use_coingecko: true             # CoinGecko trending coins (free, no key needed)
  use_cryptopanic: true           # CryptoPanic trending news (needs CRYPTOPANIC_API_KEY env var)
  # cryptopanic_api_key: ""       # Or set here instead of env var (get free key at cryptopanic.com/developers/api/)

# Risk Management
risk:
  # Position sizing limits
  max_risk_per_trade_pct: 0.02  # 2% of account per trade ($2.50 on $125)
  max_daily_drawdown_pct: 0.60  # 60% daily drawdown limit (user preference)
  max_portfolio_exposure_pct: 0.75  # 75% max capital deployed (3 positions × 25%)
  max_position_concentration_pct: 0.25  # Single position max 25%

  # Funding rate filter (block trades that pay high funding)
  max_funding_rate_pct: 0.0005  # 0.05% — block LONGs above this, SHORTs below -this

  # Consecutive loss cooldown
  consecutive_loss_cooldown:
    max_losses: 3           # Max consecutive losses before cooldown
    lookback_minutes: 30    # Window to count losses
    cooldown_minutes: 15    # How long to pause trading on that symbol

  # Bid-ask spread filter
  max_spread_bps: 8  # Reject trades where spread > 8 basis points

  # Leverage limits
  leverage_limits:
    low_volatility: 15     # < 2% volatility
    medium_volatility: 15   # 2-5% volatility
    high_volatility: 15     # > 5% volatility

  # Correlation limits
  max_correlated_positions: 3  # Max positions with correlation > 0.7

  # Volatility gate
  volatility_gate_threshold_pct: 0.05  # Block trades if volatility > 5%

  # SL/TP distance multipliers (ATR-based)
  sl_atr_multiplier: 1.2       # SL = 1.2 ATR (wider stops, give positions room to breathe)
  tp_atr_multiplier: 2.5       # TP = 2.5 ATR — wider targets to maintain R:R with wider SL
  min_rr_ratio: 2.0            # Enforce 2.0:1 R:R (positive EV at 40% win rate)
  min_sl_distance_pct: 0.006   # 0.6% floor to prevent too-tight stops
  leverage_based_tp: false     # Disabled: 2.5% TP unreachable in 10min. Using ATR-based instead

  # Position sizing method
  position_sizing:
    method: "fixed_percentage"  # kelly_criterion | fixed_percentage | atr_based
    min_position_pct: 0.20  # 20% fixed allocation per position (margin)
    max_position_pct: 0.20  # 20% fixed allocation per position (margin)
    kelly_fraction: 0.5  # Half Kelly for safety
    atr_multiplier: 2.0  # For ATR-based stop loss

  # Kill switches
  kill_switches:
    global: false  # Master kill switch
    symbols: {}    # Symbol-specific: {"BTCUSDT": true}
    strategies: {}  # Strategy-specific: {"ema_crossover_scalp": true}
    volatility_circuit_breaker:
      enabled: true
      trigger_pct: 0.10  # 10% move in 1 minute
      cooldown_seconds: 300  # 5 minutes

# Model Routing & LLM Integration
models:
  enabled: true                      # Master switch for LLM calls
  routing_strategy: "cheap_first"    # Route to cheapest model first
  primary_provider: "ollama"         # Use local Ollama for all AI calls (free + private)
  ollama_model: "qwen2.5:14b"       # Reliable reasoning, fits 16GB VRAM (5070 Ti)
  ollama_base_url: "http://localhost:11434"

  # Per-agent LLM toggle
  # LLM disabled for real-time agents: adds 15-30s latency per symbol,
  # non-deterministic, no statistical edge for scalping. Rule-based is faster & backtestable.
  agent_llm_enabled:
    research_coordinator: false      # Rule-based indicators are sufficient
    trading_decision: false          # Rule-based strategies + indicators only
    execution_agent: false           # No LLM needed for order execution
    storage_reporter: false          # No LLM needed for trade logging
    emergency_controller: false      # Rule-based safety checks only
    risk_manager: false              # ALWAYS false - rule-based only for safety

  # Timeout settings
  timeouts:
    haiku_seconds: 15
    sonnet_seconds: 30
    ollama_seconds: 30               # Timeout for local Ollama inference

  # Cost controls
  cost_limits:
    max_cost_per_cycle_usd: 0.05     # Max $0.05 per trading cycle
    max_daily_cost_usd: 5.00         # Max $5/day

  # Confidence thresholds for escalation
  confidence_thresholds:
    research: 0.70
    decision: 0.75
    risk: 0.80
    emergency: 0.90

  # Model hierarchy (cost: low to high)
  model_hierarchy:
    - name: "gpt-4o-mini"
      cost: 0.00015
      use_for: ["classification", "simple_reasoning"]

    - name: "gemini-3.0-flash"
      cost: 0.000075
      use_for: ["pattern_matching", "sentiment_analysis"]

    - name: "claude-3-5-haiku-20241022"
      cost: 0.0008
      use_for: ["risk_reasoning", "complex_decisions"]

    - name: "claude-sonnet-4-20250514"
      cost: 0.003
      use_for: ["critical_decisions", "anomaly_detection"]

# Execution Configuration
execution:
  # Protective orders (Binance-side STOP_MARKET and TAKE_PROFIT_MARKET)
  place_stop_loss: true
  place_take_profit: true

  # Paper trading settings
  paper_trading:
    enabled: true
    simulated_balance_usdt: 125  # Match real portfolio size for realistic paper testing
    base_slippage_bps: 5  # 5 basis points base slippage
    market_impact_model: "square_root"  # linear | square_root | custom

  # Fees
  fees:
    maker_bps: 2  # 0.02% maker fee
    taker_bps: 5  # 0.05% taker fee
    pre_trade_fee_filter:
      enabled: true
      fee_buffer_multiplier: 3.0  # Expected profit must be >= 3x round-trip fees (was 1.5x — barely above breakeven)

  # Hybrid mode settings
  hybrid:
    divergence_threshold_pct: 0.005  # Alert if >0.5% divergence
    alert_on_divergence: true

  # Order retry configuration
  retry:
    max_attempts: 3
    backoff_seconds: 2
    exponential_backoff: true

# Data & Storage
data:
  # Database
  database:
    type: "sqlite"  # sqlite | postgresql
    path: "data/trading_system.db"
    # For PostgreSQL:
    # host: "localhost"
    # port: 5432
    # database: "trading_system"
    # user: "trading_user"
    # password: "${POSTGRES_PASSWORD}"  # From environment

  # Audit trail
  audit:
    enabled: true
    hash_chain: true  # Use SHA-256 hash chaining
    immutable: true
    retention_days: 365

  # Backups
  backups:
    enabled: true
    frequency: "daily"
    retention_count: 30
    path: "backups/"

# Reporting
reporting:
  # Daily reports
  daily:
    enabled: true
    time_utc: "00:00"  # Generate at midnight UTC
    export_formats: ["json", "csv", "markdown"]
    include_charts: false

  # Performance metrics
  metrics:
    - "total_trades"
    - "win_rate"
    - "profit_loss"
    - "sharpe_ratio"
    - "max_drawdown"
    - "avg_holding_time"
    - "strategy_breakdown"
    - "model_accuracy"

# Strategies
strategies:
  enabled:
    - "ema_crossover_scalp"    # Trend-following: EMA crossover with convergence pre-signal
    - "rsi_pullback_scalp"     # Mean reversion in trend: buy dips/sell rallies
    - "vwap_bounce_scalp"      # Mean reversion: VWAP cross with volume confirmation
    - "bollinger_squeeze_scalp" # Volatility breakout: squeeze then expansion
    # orderbook_imbalance_scalp: DISABLED — noise-based signals, no edge
    # momentum_breakout_scalp: DISABLED — needs stronger trend regime filter

  # Strategy-specific parameters
  ema_crossover_scalp:
    timeframe: "5m"
    fast_ema: 9
    slow_ema: 21
    expected_holding_time_seconds: 180

  vwap_bounce_scalp:
    timeframe: "1m"
    deviation_bands: 2.0  # Standard deviations
    expected_holding_time_seconds: 120

  orderbook_imbalance_scalp:
    timeframe: "1m"
    imbalance_threshold: 0.3  # 30% imbalance required
    expected_holding_time_seconds: 90

  momentum_breakout_scalp:
    timeframe: "5m"
    volume_multiplier: 1.5  # 1.5x average volume required
    expected_holding_time_seconds: 240

  rsi_pullback_scalp:
    timeframe: "5m"
    rsi_oversold: 40       # Buy zone ceiling (entry when RSI < this in uptrend)
    rsi_overbought: 60     # Sell zone floor (entry when RSI > this in downtrend)
    expected_holding_time_seconds: 180

  bollinger_squeeze_scalp:
    timeframe: "5m"
    bb_period: 20
    bb_std_dev: 2.0
    squeeze_bandwidth_pct: 3.0   # Squeeze when bandwidth < 3%
    min_relative_volume: 1.2     # Volume gate for breakout confirmation
    expected_holding_time_seconds: 240

# Learning from Past Trades
# The bot automatically learns from its own trade history to improve decisions.
learning:
  # Strategy auto-disable: penalize strategy if win rate drops below threshold
  strategy_auto_disable_win_rate: 0.25   # 25% — penalize strategy below this
  strategy_auto_disable_min_trades: 30   # Need 30+ trades before learning kicks in

  # Symbol memory: penalize symbols with consistently negative P&L
  symbol_min_win_rate: 0.20              # 20% — penalize symbol below this
  symbol_min_trades: 20                  # Need 20+ trades before learning kicks in

  # Time-of-day: soft penalty during historically losing hours
  hour_min_win_rate: 0.30                # 30% — soft penalty for hours below this

  # Regime-based confidence: boost/penalize based on strategy+regime history
  regime_confidence_boost: 0.08          # +8% confidence for proven regime fit
  regime_confidence_penalty: 0.10        # -10% confidence for poor regime fit

# Trailing Stop Configuration (Ratcheting TP/SL)
trailing_stop:
  enabled: true
  check_interval_seconds: 5

  # TP/SL percentages (applied from current price at each ratchet)
  tp_pct: 0.005        # 0.5% — take profit trigger (ratchets, doesn't close)
  sl_pct: 0.007        # 0.7% — stop loss trigger (CLOSES position)

  # Hard stop: use initial SL from TradingDecision (1.5 ATR-based)
  # After first TP hit and ratchet, switches to sl_pct for subsequent SL levels
  use_decision_stop_loss: true

  # Fallback SL % if no TradingDecision stop_loss available
  hard_stop_fallback_pct: 0.02  # 2%

  # Time-based exit (safety net)
  max_holding_time_seconds: 900  # 15 minutes (match scalping config)

  # Dynamic SL adjustment (move SL to breakeven, then trail)
  dynamic_sl:
    enabled: true
    breakeven_move_pct: 0.004    # Move SL to breakeven at 0.4% profit (lock in earlier)
    trail_activation_pct: 0.008  # Start trailing at 0.8% profit (was 1.2%)
    trail_step_pct: 0.003        # SL trails 0.3% behind price (tighter trail)
    min_move_pct: 0.001          # Only move SL if change > 0.1%

  # Dynamic TP/SL recalculation (ATR-based, replaces Binance-side orders)
  dynamic_tp_sl:
    enabled: true
    recalc_threshold_pct: 0.004   # Recalculate when price moves 0.4% from last calc
    use_current_atr: true
    tp_atr_multiplier: 2.0        # TP = current_price +/- ATR * mult
    sl_atr_multiplier: 1.5        # SL = current_price -/+ ATR * mult
    min_rr_ratio: 1.5
    max_recalcs: 10
    tp_proximity_trigger_pct: 0.20  # Recalc when within 20% of remaining TP distance

  # Logging
  log_level_updates: false  # Log each TP/SL level update

# Market Regime Detection (LLM-based, runs every 15 minutes)
regime_detection:
  enabled: true  # Claude Haiku classifies market regime every 15min
  interval_seconds: 900  # 15 minutes
  model: "claude-haiku-4-5-20251001"
  fallback_regime: "DEFAULT"  # Used if API call fails

# WebSocket Streaming (supplements REST for real-time price/book data)
websocket:
  enabled: true
  stale_threshold_seconds: 10

# Monitoring & Alerts
monitoring:
  # API health
  api_health:
    check_interval_seconds: 30
    timeout_seconds: 10

  # Risk monitoring
  risk_monitoring:
    check_interval_seconds: 60
    alert_channels: ["console", "log_file"]

  # Performance tracking
  performance:
    track_model_usage: true
    track_execution_quality: true
    track_strategy_performance: true

# Logging
logging:
  level: "INFO"  # DEBUG | INFO | WARNING | ERROR | CRITICAL
  format: "json"  # json | text
  outputs:
    console: true
    file: true
    file_path: "logs/trading_system.log"
  rotation:
    max_size_mb: 100
    backup_count: 10
